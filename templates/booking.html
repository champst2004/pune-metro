<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Ticket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            color: #333;
        }

        form {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        select, input[type="text"], button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: 5px;
            color: red;
        }
    </style>
</head>
<body>

    <h1>Book Your Ticket</h1>

    <form action="/booking" method="POST">
        <label for="departure">Departure Station:</label>
        <select name="departure" required>
            {% for station in stations %}
                <option value="{{ station['name'] }}">{{ station['name'] }}</option>
            {% endfor %}
        </select>

        <label for="arrival">Arrival Station:</label>
        <select name="arrival" required>
            {% for station in stations %}
                <option value="{{ station['name'] }}">{{ station['name'] }}</option>
            {% endfor %}
        </select>

        <label for="cardID">Card ID (optional):</label>
        <input type="text" name="cardID" placeholder="Enter your card ID if you have one">

        <button type="submit">Submit</button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li><strong>{{ category }}:</strong> {{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

</body>
</html>
