<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune Metro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            text-align: center;
            padding-top: 50px;
        }

        a {
            font-size: 18px;
            color: #007bff;
            text-decoration: none;
            padding: 10px 20px;
            margin: 10px;
            display: inline-block;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #007bff;
            color: white;
        }

        p {
            font-size: 16px;
            margin-top: 30px;
            color: #333;
        }

        p a {
            font-size: 16px;
            color: #007bff;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="/login2">Login as User</a>
    <a href="/admin">Login as Admin</a>
    <p><a href="/home">Back to Home</a></p>
</body>
</html>
